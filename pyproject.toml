[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onboard-sync"
version = "0.1.0"
description = "Reconciliation engine that keeps a new hire consistent across Ashby, Workday, Okta/Lumos, equipment and the cohort tracker."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
claude = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["onboard-sync[api,claude,mcp,dev]"]

[project.scripts]
onboard-sync = "onboard_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onboard_sync = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
